name: CI Evaluation & Regression Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Statistical Correctness Suite
        run: |
          pytest tests/ -v

      - name: Execute 60-Task Regression Gate
        run: |
          python eval_cli.py --config configs/eval_suite.yaml --baseline baseline_v1 --candidate candidate_v2
